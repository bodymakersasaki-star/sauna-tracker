<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>♨️ サウナ記録帳</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,150,50,0.12);
    --accent: #c87820;
    --accent2: #e05010;
    --teal: #4ac0a0;
    --text: #f0e8e0;
    --muted: #7a6a5a;
    --dim: #4a3a2a;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    background-image:
      radial-gradient(ellipse at 15% 15%, rgba(200,100,30,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(30,140,140,0.06) 0%, transparent 55%);
    background-attachment: fixed;
  }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,8,8,0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .header-top { display:flex; justify-content:space-between; align-items:center; }
  .header-title { font-size:11px; letter-spacing:.15em; color:var(--accent); text-transform:uppercase; margin-bottom:2px; }
  .header-name { font-size:17px; font-weight:900; }
  .btn-sm {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 6px 13px;
    color: var(--muted); font-size:12px; cursor:pointer;
    font-family: inherit;
  }
  .tabs { display:flex; gap:3px; margin-top:12px; background:rgba(255,255,255,0.04); border-radius:12px; padding:3px; }
  .tab {
    flex:1; padding:7px; border-radius:10px; border:none;
    font-size:13px; font-weight:700; cursor:pointer;
    background:transparent; color:var(--dim);
    transition:all .15s; font-family:inherit;
  }
  .tab.active { background:rgba(200,120,30,0.25); color:var(--accent); }

  /* Pages */
  .page { display:none; padding:16px 14px 90px; }
  .page.active { display:block; }

  /* Stats grid */
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px; }
  .stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:12px 8px; text-align:center;
  }
  .stat-icon { font-size:18px; }
  .stat-val { font-size:15px; font-weight:900; margin-top:3px; }
  .stat-label { font-size:10px; color:var(--muted); margin-top:2px; }

  /* Log cards */
  .log-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:13px 15px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; margin-bottom:8px;
    transition:background .15s;
    width:100%; text-align:left; color:var(--text);
    font-family:inherit;
  }
  .log-card:active { background:rgba(255,255,255,0.07); }
  .log-date { font-size:12px; color:var(--accent); }
  .log-facility { font-size:16px; font-weight:700; margin-top:2px; }
  .log-meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .log-mood { font-size:26px; }
  .teal { color:var(--teal); }

  /* Empty state */
  .empty { text-align:center; padding:60px 20px; color:var(--dim); }
  .empty-icon { font-size:52px; margin-bottom:12px; }
  .empty-text { font-size:15px; }
  .empty-sub { font-size:12px; margin-top:6px; }

  /* FAB */
  .fab {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:30px; padding:14px 36px;
    color:#fff; font-size:16px; font-weight:900; cursor:pointer;
    box-shadow:0 6px 24px rgba(200,120,30,0.5); z-index:50;
    font-family:inherit; letter-spacing:.04em;
    transition:transform .1s;
  }
  .fab:active { transform:translateX(-50%) scale(0.96); }

  /* Form */
  .form-section {
    border-radius:16px; padding:16px; margin-bottom:16px;
  }
  .form-section.teal-bg { background:rgba(74,192,160,0.06); border:1px solid rgba(74,192,160,0.15); }
  .form-section.orange-bg { background:rgba(200,120,30,0.06); border:1px solid rgba(200,120,30,0.15); }
  .section-label {
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    margin-bottom:12px; font-weight:700;
  }
  .section-label.teal { color:var(--teal); }
  .section-label.orange { color:var(--accent); }

  .field-label { font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px; }
  .field { margin-bottom:14px; }
  input, select, textarea {
    width:100%; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; padding:10px 12px;
    color:var(--text); font-size:14px; outline:none;
    font-family:inherit;
    -webkit-appearance:none;
  }
  input::placeholder { color:var(--dim); }
  textarea { resize:none; }
  select option { background:#1a1a1a; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

  .weight-result {
    text-align:center; margin-top:10px;
    color:var(--teal); font-weight:700; font-size:15px;
  }

  /* Set card */
  .set-card {
    background:rgba(0,0,0,0.25); border-radius:12px; padding:12px;
    border:1px solid rgba(255,255,255,0.05); margin-bottom:8px;
  }
  .set-header { display:flex; justify-content:space-between; margin-bottom:8px; }
  .set-num { font-size:12px; color:var(--muted); }
  .btn-del { background:none; border:none; color:#904040; cursor:pointer; font-size:12px; font-family:inherit; }
  .btn-add-set {
    background:rgba(200,120,30,0.2); border:1px solid rgba(200,120,30,0.3);
    border-radius:20px; padding:4px 13px; color:var(--accent);
    font-size:12px; cursor:pointer; font-family:inherit;
  }

  /* Mood */
  .mood-row { display:flex; gap:10px; justify-content:center; padding:4px 0; }
  .mood-btn {
    font-size:28px; background:none; border:none; cursor:pointer;
    opacity:.3; transform:scale(1); transition:all .15s;
  }
  .mood-btn.selected { opacity:1; transform:scale(1.25); }

  /* Save btn */
  .btn-save {
    width:100%; border:none; border-radius:14px; padding:15px;
    color:#fff; font-size:16px; font-weight:900; cursor:pointer;
    font-family:inherit; transition:all .2s;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 4px 20px rgba(200,120,30,0.35);
  }
  .btn-save:disabled { background:rgba(255,255,255,0.08); box-shadow:none; cursor:not-allowed; }

  /* Back header */
  .back-header {
    position:sticky; top:0; z-index:100;
    background:rgba(8,8,8,0.9); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .btn-back { background:none; border:none; color:var(--accent); font-size:26px; cursor:pointer; padding:0 4px; line-height:1; }
  .back-title { font-size:16px; font-weight:700; }

  /* Detail */
  .detail-date { font-size:13px; color:var(--accent); }
  .detail-facility { font-size:26px; font-weight:900; margin-top:4px; }
  .detail-mood { font-size:32px; margin-top:6px; }
  .detail-card {
    border-radius:16px; padding:16px; margin-top:14px;
  }
  .detail-card.teal-bg { background:rgba(74,192,160,0.08); border:1px solid rgba(74,192,160,0.18); }
  .detail-card.orange-bg { background:rgba(200,120,30,0.07); border:1px solid rgba(200,120,30,0.15); }
  .detail-card.plain { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); }

  .weight-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; text-align:center; margin-top:10px; }
  .weight-label { font-size:10px; color:#5a8a7a; }
  .weight-val { font-size:22px; font-weight:900; }
  .weight-unit { font-size:11px; }
  .weight-arrow { color:var(--teal); font-size:20px; }
  .weight-loss { text-align:center; margin-top:10px; color:var(--teal); font-weight:700; font-size:15px; }

  .set-row {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(0,0,0,0.2); border-radius:10px; padding:9px 13px;
    font-size:13px; margin-bottom:6px;
  }
  .set-row-num { color:var(--muted); }
  .set-row-data { display:flex; gap:14px; }

  .total-min { text-align:right; font-size:12px; color:var(--dim); margin-top:6px; }

  .note-label { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .note-text { font-size:14px; line-height:1.7; }

  .btn-delete {
    width:100%; background:rgba(180,40,40,0.1); border:1px solid rgba(180,40,40,0.22);
    border-radius:12px; padding:12px; color:#c05050;
    font-size:14px; cursor:pointer; margin-top:14px; font-family:inherit;
  }

  /* Login */
  #loginPage {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:28px;
  }
  .login-hero { text-align:center; margin-bottom:40px; }
  .login-icon { font-size:60px; margin-bottom:12px; }
  .login-title { font-size:26px; font-weight:900; letter-spacing:-.02em; }
  .login-sub { font-size:13px; color:var(--muted); margin-top:6px; }
  .login-section { width:100%; max-width:340px; margin-bottom:24px; }
  .login-section-label { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:12px; }
  .user-btn {
    background:var(--surface); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer; color:var(--text); text-align:left; width:100%;
    margin-bottom:10px; font-family:inherit;
    transition:background .15s;
  }
  .user-btn:active { background:rgba(255,255,255,0.07); }
  .avatar {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; flex-shrink:0;
  }
  .user-name { font-size:16px; font-weight:700; }
  .user-hint { font-size:11px; color:var(--muted); margin-top:2px; }
  .new-user-row { display:flex; gap:10px; }
  .new-user-row input { flex:1; }
  .btn-create {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:10px; padding:10px 18px;
    color:#fff; font-weight:900; cursor:pointer; font-size:14px;
    white-space:nowrap; font-family:inherit;
  }
  .btn-create:disabled { background:rgba(255,255,255,0.08); cursor:not-allowed; }
  .login-note { font-size:11px; color:#4a3a2a; margin-top:10px; line-height:1.6; }

  /* Month filter */
  .month-filter { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .month-filter::-webkit-scrollbar { display:none; }
  .month-btn {
    flex-shrink:0; padding:5px 13px; border-radius:20px; font-size:12px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color:var(--text); cursor:pointer; font-family:inherit; transition:all .15s;
  }
  .month-btn.active { background:rgba(200,120,30,0.28); border-color:rgba(200,120,30,0.5); color:var(--accent); }

  /* Autocomplete */
  .autocomplete-wrap { position:relative; }
  .autocomplete-list {
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:200;
    background:#1a1208; border:1px solid rgba(200,120,30,0.3);
    border-radius:12px; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.6);
  }
  .autocomplete-item {
    padding:11px 14px; font-size:14px; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:background .1s;
  }
  .autocomplete-item:last-child { border-bottom:none; }
  .autocomplete-item:active, .autocomplete-item.highlighted { background:rgba(200,120,30,0.18); }
  .autocomplete-icon { font-size:16px; flex-shrink:0; }
  .autocomplete-match { color:var(--accent); font-weight:700; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .page.active { animation:fadeIn .2s ease; }
</style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="loginPage">
  <div class="login-hero">
    <div class="login-icon">♨️</div>
    <div class="login-title">サウナ記録帳</div>
    <div class="login-sub">いつでもどこでも記録しよう</div>
  </div>

  <div class="login-section" id="existingUsersSection" style="display:none">
    <div class="login-section-label">アカウントを選択</div>
    <div id="userList"></div>
  </div>

  <div class="login-section">
    <div class="login-section-label" id="newUserLabel">アカウントを作成</div>
    <div class="new-user-row">
      <input type="text" id="newNameInput" placeholder="ニックネームを入力" maxlength="20">
      <button class="btn-create" id="createBtn" onclick="createUser()" disabled>作成</button>
    </div>
    <div class="login-note">※ データはこのブラウザに保存されます。同じブラウザで開く限り記録が残ります。</div>
  </div>
</div>

<!-- ═══════════════ MAIN APP ═══════════════ -->
<div id="appRoot" style="display:none">

  <!-- Header -->
  <div class="header" id="mainHeader">
    <div class="header-top">
      <div>
        <div class="header-title">♨️ Sauna Log</div>
        <div class="header-name" id="headerName"></div>
      </div>
      <button class="btn-sm" onclick="signOut()">ログアウト</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabMine" onclick="switchTab('mine')">自分の記録</button>
      <button class="tab" id="tabStats" onclick="switchTab('stats')">統計</button>
    </div>
  </div>

  <!-- HOME: My logs -->
  <div class="page active" id="pageMine">
    <div id="statsBar"></div>
    <div id="monthFilter" class="month-filter"></div>
    <div id="logList"></div>
  </div>

  <!-- HOME: Stats -->
  <div class="page" id="pageStats">
    <div id="statsContent"></div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fabBtn" onclick="goAdd()">＋ 記録する</button>

</div>

<!-- ═══════════════ ADD PAGE ═══════════════ -->
<div id="addRoot" style="display:none">
  <div class="back-header">
    <button class="btn-back" onclick="goHome()">‹</button>
    <div class="back-title" id="addFormTitle">新しい記録</div>
    <div style="width:34px"></div>
  </div>
  <div style="padding:18px 14px 80px">

    <div class="field">
      <div class="field-label">日付</div>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <div class="field-label">施設名</div>
      <div class="autocomplete-wrap">
        <input type="text" id="fFacility" placeholder="例：スパ サンコート" oninput="onFacilityInput()" autocomplete="off">
        <div class="autocomplete-list" id="acList" style="display:none"></div>
      </div>
    </div>

    <!-- Weight -->
    <div class="form-section teal-bg">
      <div class="section-label teal">💧 体重管理</div>
      <div class="grid2">
        <div>
          <div class="field-label">入浴前 (kg)</div>
          <input type="number" id="fWBefore" step="0.1" placeholder="00.0" oninput="calcLoss()">
        </div>
        <div>
          <div class="field-label">入浴後 (kg)</div>
          <input type="number" id="fWAfter" step="0.1" placeholder="00.0" oninput="calcLoss()">
        </div>
      </div>
      <div class="weight-result" id="lossPreview"></div>
    </div>

    <!-- Sets -->
    <div class="form-section orange-bg">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="section-label orange" style="margin:0">♨️ セット記録</div>
        <button class="btn-add-set" onclick="addSet()">＋ セット追加</button>
      </div>
      <div id="setsContainer"></div>
    </div>

    <!-- Mood -->
    <div class="field">
      <div class="field-label">整い度</div>
      <div class="mood-row" id="moodRow"></div>
    </div>

    <!-- Notes -->
    <div class="field">
      <div class="field-label">メモ</div>
      <textarea id="fNotes" rows="3" placeholder="感想、混み具合など..."></textarea>
    </div>

    <button class="btn-save" id="saveBtn" onclick="saveLog()" disabled>🔥 保存する</button>
    <button class="btn-save" id="updateBtn" onclick="updateLog()" style="display:none;background:linear-gradient(135deg,#4a90c8,#2060a0);box-shadow:0 4px 20px rgba(74,144,200,0.35)">✏️ 更新する</button>
  </div>
</div>

<!-- ═══════════════ DETAIL PAGE ═══════════════ -->
<div id="detailRoot" style="display:none">
  <div class="back-header">
    <button class="btn-back" onclick="goHome()">‹</button>
    <div class="back-title" id="detailTitle">詳細</div>
    <button class="btn-sm" id="editBtn" onclick="goEdit()" style="color:var(--accent);border-color:rgba(200,120,30,0.3)">編集</button>
  </div>
  <div style="padding:18px 14px 80px" id="detailContent"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════
const USERS_KEY = 'sauna_users';
const LOGS_KEY = (uid) => `sauna_logs_${uid}`;
const SESSION_KEY = 'sauna_session';
const MOODS = ['','😞','😐','🙂','😊','🔥'];
const COLORS = ['#e8624a','#4ac0a0','#a07de8','#e8c04a','#4a90e8','#e84a90'];

let currentUser = null;
let logs = [];
let sets = [];
let selectedMood = '4';
let currentFilter = '';
let editingLogId = null;

function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); } catch{return[];} }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getLogs(uid) { try { return JSON.parse(localStorage.getItem(LOGS_KEY(uid))||'[]'); } catch{return[];} }
function saveLogs(uid, l) { localStorage.setItem(LOGS_KEY(uid), JSON.stringify(l)); }

function avatarColor(name) {
  let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))%COLORS.length;
  return COLORS[h];
}
function avatarHTML(name, size=40) {
  const c = avatarColor(name);
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*.38}px;background:linear-gradient(135deg,${c}88,${c}44);border:2px solid ${c}66;color:${c}">${name[0].toUpperCase()}</div>`;
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'});
}
function totalMin(sets) { return sets.reduce((s,x)=>s+(parseInt(x.duration)||0),0); }
function weightLoss(a,b) {
  if(!a||!b) return null;
  const v = parseFloat(a)-parseFloat(b);
  return isNaN(v)?null:v.toFixed(1);
}

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('newNameInput');
  inp.addEventListener('input', () => {
    document.getElementById('createBtn').disabled = !inp.value.trim();
  });
  inp.addEventListener('keydown', e => { if(e.key==='Enter') createUser(); });

  renderLoginUsers();
  const sess = localStorage.getItem(SESSION_KEY);
  if(sess) {
    try {
      const u = JSON.parse(sess);
      const users = getUsers();
      if(users.find(x=>x.id===u.id)) { signIn(u); return; }
    } catch{}
  }
});

function renderLoginUsers() {
  const users = getUsers();
  const sec = document.getElementById('existingUsersSection');
  const label = document.getElementById('newUserLabel');
  if(users.length===0){ sec.style.display='none'; label.textContent='アカウントを作成'; return; }
  sec.style.display='block';
  label.textContent='新しいアカウントを作成';
  document.getElementById('userList').innerHTML = users.map(u=>`
    <button class="user-btn" onclick="signIn(${JSON.stringify(u).replace(/"/g,'&quot;')})">
      ${avatarHTML(u.name,40)}
      <div>
        <div class="user-name">${u.name}</div>
        <div class="user-hint">タップしてログイン</div>
      </div>
    </button>
  `).join('');
}

function createUser() {
  const name = document.getElementById('newNameInput').value.trim();
  if(!name) return;
  const users = getUsers();
  const user = { id: Date.now().toString(), name };
  users.push(user);
  saveUsers(users);
  signIn(user);
}

function signIn(user) {
  currentUser = user;
  localStorage.setItem(SESSION_KEY, JSON.stringify(user));
  logs = getLogs(user.id);
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appRoot').style.display='block';
  document.getElementById('headerName').textContent = user.name;
  renderHome();
}

function signOut() {
  localStorage.removeItem(SESSION_KEY);
  currentUser=null; logs=[];
  document.getElementById('appRoot').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  renderLoginUsers();
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function showOnly(id) {
  ['loginPage','appRoot','addRoot','detailRoot'].forEach(x=>{
    document.getElementById(x).style.display='none';
  });
  document.getElementById(id).style.display = id==='loginPage'?'flex':'block';
}

function goHome() {
  editingLogId = null;
  showOnly('appRoot');
  renderHome();
}
function goAdd() {
  editingLogId = null;
  showOnly('addRoot');
  initAddForm(null);
}
function goEdit() {
  const log = logs.find(l=>l.id===editingLogId);
  if(!log) return;
  showOnly('addRoot');
  initAddForm(log);
}
function goDetail(logId) {
  const log = logs.find(l=>l.id===logId);
  if(!log) return;
  editingLogId = logId;
  showOnly('detailRoot');
  renderDetail(log);
}

function switchTab(tab) {
  document.getElementById('tabMine').classList.toggle('active', tab==='mine');
  document.getElementById('tabStats').classList.toggle('active', tab==='stats');
  document.getElementById('pageMine').classList.toggle('active', tab==='mine');
  document.getElementById('pageStats').classList.toggle('active', tab==='stats');
  document.getElementById('fabBtn').style.display = tab==='mine'?'block':'none';
  if(tab==='stats') renderStats();
}

// ═══════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════
function renderHome() {
  currentFilter='';
  renderStatsBar();
  renderMonthFilter();
  renderLogList();
}

function renderStatsBar() {
  if(logs.length===0){ document.getElementById('statsBar').innerHTML=''; return; }
  const losses = logs.filter(l=>l.weight_before&&l.weight_after).map(l=>parseFloat(l.weight_before)-parseFloat(l.weight_after)).filter(x=>!isNaN(x));
  const avg = losses.length?(losses.reduce((a,b)=>a+b,0)/losses.length).toFixed(1):null;
  const thisMonth = logs.filter(l=>l.date.startsWith(new Date().toISOString().slice(0,7))).length;
  document.getElementById('statsBar').innerHTML=`
    <div class="stats">
      <div class="stat-card"><div class="stat-icon">♨️</div><div class="stat-val">${logs.length}回</div><div class="stat-label">総回数</div></div>
      <div class="stat-card"><div class="stat-icon">💧</div><div class="stat-val">${avg?`-${avg}kg`:'—'}</div><div class="stat-label">平均発汗</div></div>
      <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">${thisMonth}回</div><div class="stat-label">今月</div></div>
    </div>
  `;
}

function renderMonthFilter() {
  const months = [...new Set(logs.map(l=>l.date.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  if(months.length<2){ document.getElementById('monthFilter').innerHTML=''; return; }
  document.getElementById('monthFilter').innerHTML =
    `<button class="month-btn ${!currentFilter?'active':''}" onclick="setFilter('')">すべて</button>` +
    months.map(m=>`<button class="month-btn ${currentFilter===m?'active':''}" onclick="setFilter('${m}')">${m.replace('-','年')}月</button>`).join('');
}

function setFilter(m) {
  currentFilter=m;
  renderMonthFilter();
  renderLogList();
}

function renderLogList() {
  const filtered = currentFilter ? logs.filter(l=>l.date.startsWith(currentFilter)) : logs;
  const el = document.getElementById('logList');
  if(filtered.length===0){
    el.innerHTML=`<div class="empty"><div class="empty-icon">♨️</div><div class="empty-text">まだ記録がありません</div><div class="empty-sub">＋ボタンから最初の記録を追加しよう</div></div>`;
    return;
  }
  el.innerHTML = filtered.map(log=>{
    const loss = weightLoss(log.weight_before,log.weight_after);
    return `<button class="log-card" onclick="goDetail('${log.id}')">
      <div>
        <div class="log-date">${fmtDate(log.date)}</div>
        <div class="log-facility">${log.facility}</div>
        <div class="log-meta">${log.sets.length}セット・${totalMin(log.sets)}分${loss?`<span class="teal" style="margin-left:8px">-${loss}kg</span>`:''}</div>
      </div>
      <div class="log-mood">${MOODS[parseInt(log.mood)]||'🙂'}</div>
    </button>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════
function renderStats() {
  if(logs.length===0){
    document.getElementById('statsContent').innerHTML=`<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">記録を追加すると統計が見られます</div></div>`;
    return;
  }

  // ── 全期間集計 ──
  const facilities = {};
  logs.forEach(l=>{ facilities[l.facility]=(facilities[l.facility]||0)+1; });
  const facRank = Object.entries(facilities).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const losses = logs.filter(l=>l.weight_before&&l.weight_after).map(l=>({
    date:l.date, loss:parseFloat(l.weight_before)-parseFloat(l.weight_after), facility:l.facility
  })).filter(x=>!isNaN(x.loss));
  const maxLoss = losses.length?losses.reduce((a,b)=>a.loss>b.loss?a:b):null;
  const avgLoss = losses.length?(losses.reduce((a,b)=>a+b.loss,0)/losses.length).toFixed(1):null;
  const avgTime = logs.length?(logs.reduce((s,l)=>s+totalMin(l.sets),0)/logs.length).toFixed(0):null;
  const avgMood = logs.length?(logs.reduce((s,l)=>s+parseInt(l.mood||3),0)/logs.length).toFixed(1):null;

  // ── 月別集計 ──
  const monthMap = {};
  logs.forEach(l => {
    const m = l.date.slice(0,7);
    if(!monthMap[m]) monthMap[m] = { count:0, losses:[], moods:[], weightLogs:[] };
    monthMap[m].count++;
    if(l.weight_before && l.weight_after) {
      const loss = parseFloat(l.weight_before)-parseFloat(l.weight_after);
      if(!isNaN(loss)) monthMap[m].losses.push(loss);
    }
    monthMap[m].moods.push(parseInt(l.mood||3));
    if(l.weight_before && !isNaN(parseFloat(l.weight_before))) {
      monthMap[m].weightLogs.push({ date:l.date, w:parseFloat(l.weight_before) });
    }
  });
  const months = Object.keys(monthMap).sort((a,b)=>b.localeCompare(a));

  // ── 月別体重グラフデータ ──
  const weightMonths = months.map(m => {
    const wl = monthMap[m].weightLogs.sort((a,b)=>a.date.localeCompare(b.date));
    if(wl.length===0) return null;
    return { month:m, first:wl[0].w, last:wl[wl.length-1].w, diff:(wl[wl.length-1].w - wl[0].w) };
  }).filter(Boolean).reverse(); // 古い順に並べる

  // グラフ描画（1ヶ月でも表示）
  const chartHTML = weightMonths.length >= 1 ? (() => {
    const weights = weightMonths.map(m=>m.last);
    const minW = Math.min(...weights) - 1;
    const maxW = Math.max(...weights) + 1;
    const range = maxW - minW || 1;
    const W = 320, H = 140, PL = 42, PR = 12, PT = 16, PB = 32;
    const cW = W-PL-PR, cH = H-PT-PB;
    const n = weightMonths.length;
    const pts = weightMonths.map((m,i) => ({
      x: PL + (n===1 ? cW/2 : i/(n-1)*cW),
      y: PT + cH - (m.last-minW)/range*cH,
      m, i
    }));
    const path = pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');
    const area = `M${pts[0].x},${PT+cH} ` + pts.map(p=>`L${p.x},${p.y}`).join(' ') + ` L${pts[pts.length-1].x},${PT+cH} Z`;

    // Y軸ラベル（3段階）
    const yLabels = [minW, (minW+maxW)/2, maxW].map((v,i)=>{
      const y = PT + cH - (v-minW)/range*cH;
      return `<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="9" fill="#6a5a4a">${v.toFixed(1)}</text>`;
    });

    return `
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,150,50,0.12);border-radius:16px;padding:16px;margin-bottom:14px;overflow:hidden">
      <div style="font-size:11px;color:#c87820;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">⚖️ 月別体重推移（月末の入浴前）</div>
      <div style="overflow-x:auto">
        <svg width="${W}" height="${H}" style="display:block;min-width:${W}px">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4ac0a0" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#4ac0a0" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- Grid lines -->
          ${[0,0.5,1].map(t=>{
            const y = PT + t*cH;
            return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
          }).join('')}
          <!-- Y labels -->
          ${yLabels.join('')}
          <!-- Area -->
          <path d="${area}" fill="url(#areaGrad)"/>
          <!-- Line -->
          <path d="${path}" fill="none" stroke="#4ac0a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <!-- Dots & X labels -->
          ${pts.map((p,i)=>{
            const m = p.m;
            const diff = m.diff;
            const diffColor = diff < 0 ? '#4ac0a0' : diff > 0 ? '#e05010' : '#7a6a5a';
            const label = m.month.replace(/(\d+)-(\d+)/,(_,y,mo)=>`${mo}月`);
            return `
              <circle cx="${p.x}" cy="${p.y}" r="4" fill="#4ac0a0" stroke="#080808" stroke-width="2"/>
              <text x="${p.x}" y="${H-6}" text-anchor="middle" font-size="9" fill="#7a6a5a">${label}</text>
            `;
          }).join('')}
        </svg>
      </div>
      <!-- 月別数値 -->
      <div style="display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px">
        ${weightMonths.map(m=>{
          const diff = m.diff;
          const diffColor = diff<0?'#4ac0a0':diff>0?'#e05010':'#7a6a5a';
          const diffStr = diff===0?'±0':(diff>0?'+':'')+diff.toFixed(1);
          const label = m.month.replace(/(\d+)-(\d+)/,(_,y,mo)=>`${mo}月`);
          return `<div style="flex-shrink:0;background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 10px;text-align:center;min-width:64px">
            <div style="font-size:10px;color:#6a5a4a">${label}</div>
            <div style="font-size:13px;font-weight:700;margin-top:2px">${m.first.toFixed(1)}→${m.last.toFixed(1)}</div>
            <div style="font-size:11px;font-weight:700;color:${diffColor};margin-top:1px">${diffStr}kg</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  })() : '';

  // ── 月別サウナ統計テーブル ──
  const monthTableHTML = `
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,150,50,0.12);border-radius:16px;padding:16px;margin-bottom:14px">
      <div style="font-size:11px;color:#c87820;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">📅 月別サウナ統計</div>
      ${months.map(m=>{
        const d = monthMap[m];
        const avgL = d.losses.length?(d.losses.reduce((a,b)=>a+b,0)/d.losses.length).toFixed(1):null;
        const avgMoodM = d.moods.length?(d.moods.reduce((a,b)=>a+b,0)/d.moods.length):null;
        const label = m.replace(/(\d+)-(\d+)/,(_,y,mo)=>`${y}年${mo}月`);
        return `
        <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:700">${label}</div>
            <div style="font-size:11px;color:#6a5a4a;margin-top:2px">${d.count}回入浴</div>
          </div>
          <div style="display:flex;gap:14px;align-items:center">
            ${avgL?`<div style="text-align:center"><div style="font-size:11px;color:#4ac0a0;font-weight:700">-${avgL}kg</div><div style="font-size:9px;color:#5a4a3a">平均発汗</div></div>`:''}
            ${avgMoodM?`<div style="text-align:center"><div style="font-size:16px">${MOODS[Math.round(avgMoodM)]}</div><div style="font-size:9px;color:#5a4a3a">整い度</div></div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;

  document.getElementById('statsContent').innerHTML=`
    <!-- 全期間サマリー -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      ${[
        {icon:'⏱',label:'平均時間',val:avgTime?`${avgTime}分`:'—'},
        {icon:'💧',label:'平均発汗',val:avgLoss?`-${avgLoss}kg`:'—'},
        {icon:'🔥',label:'整い平均',val:avgMood?`${MOODS[Math.round(avgMood)]} ${avgMood}`:'—'},
        {icon:'🏆',label:'最大発汗',val:maxLoss?`-${maxLoss.loss.toFixed(1)}kg`:'—'},
      ].map(s=>`<div class="stat-card"><div class="stat-icon">${s.icon}</div><div class="stat-val" style="font-size:14px">${s.val}</div><div class="stat-label">${s.label}</div></div>`).join('')}
    </div>

    <!-- 月別体重グラフ -->
    ${chartHTML}

    <!-- 月別サウナ統計 -->
    ${monthTableHTML}

    <!-- よく行く施設 -->
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,150,50,0.12);border-radius:16px;padding:16px;margin-bottom:14px">
      <div style="font-size:11px;color:#c87820;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">🏅 よく行く施設</div>
      ${facRank.map(([name,count],i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;${i<facRank.length-1?'border-bottom:1px solid rgba(255,255,255,0.05)':''}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="font-size:13px;color:#6a5a4a;width:20px">${i+1}</div>
            <div style="font-size:14px">${name}</div>
          </div>
          <div style="font-size:13px;color:#c87820;font-weight:700">${count}回</div>
        </div>
      `).join('')}
    </div>

    ${maxLoss?`
    <div style="background:rgba(74,192,160,0.07);border:1px solid rgba(74,192,160,0.15);border-radius:16px;padding:16px;margin-bottom:14px">
      <div style="font-size:11px;color:#4ac0a0;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">💧 最大発汗記録</div>
      <div style="font-size:22px;font-weight:900;color:#4ac0a0">-${maxLoss.loss.toFixed(1)}kg</div>
      <div style="font-size:12px;color:#5a8a7a;margin-top:4px">${fmtDate(maxLoss.date)} / ${maxLoss.facility}</div>
    </div>`:''}

    <!-- エクスポート／インポート -->
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:14px">
      <div style="font-size:11px;color:#7a6a5a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">💾 データ管理</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <button onclick="exportCSV()" style="background:rgba(74,192,160,0.12);border:1px solid rgba(74,192,160,0.25);border-radius:12px;padding:12px;color:#4ac0a0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          📊 CSV<div style="font-size:10px;font-weight:400;color:#4a8a7a;margin-top:3px">Excelで開ける</div>
        </button>
        <button onclick="exportJSON()" style="background:rgba(200,120,30,0.12);border:1px solid rgba(200,120,30,0.25);border-radius:12px;padding:12px;color:#c87820;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          📁 JSON<div style="font-size:10px;font-weight:400;color:#8a6a20;margin-top:3px">バックアップ用</div>
        </button>
      </div>
      <button onclick="document.getElementById('importFile').click()" style="width:100%;background:rgba(160,125,232,0.12);border:1px solid rgba(160,125,232,0.25);border-radius:12px;padding:12px;color:#a07de8;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
        📂 JSONから復元する<div style="font-size:10px;font-weight:400;color:#7a5ab8;margin-top:3px">バックアップファイルを選択</div>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  `;
}

// ═══════════════════════════════════════════════
// ADD / EDIT FORM
// ═══════════════════════════════════════════════
function initAddForm(log) {
  const isEdit = !!log;
  document.getElementById('addFormTitle').textContent = isEdit ? '記録を編集' : '新しい記録';
  document.getElementById('saveBtn').style.display = isEdit ? 'none' : 'block';
  document.getElementById('saveBtn').disabled = isEdit ? false : true;
  document.getElementById('updateBtn').style.display = isEdit ? 'block' : 'none';

  document.getElementById('fDate').value = isEdit ? log.date : new Date().toISOString().split('T')[0];
  document.getElementById('fFacility').value = isEdit ? log.facility : '';
  document.getElementById('fWBefore').value = isEdit ? (log.weight_before||'') : '';
  document.getElementById('fWAfter').value = isEdit ? (log.weight_after||'') : '';
  document.getElementById('fNotes').value = isEdit ? (log.notes||'') : '';
  document.getElementById('lossPreview').textContent = '';
  selectedMood = isEdit ? (log.mood||'4') : '4';
  sets = isEdit ? log.sets.map(s=>({...s})) : [{duration:'10',temp:'90',water:'yes'}];
  renderSets();
  renderMoods();
  if(!isEdit) validateForm();
  else calcLoss();
}

function renderSets() {
  document.getElementById('setsContainer').innerHTML = sets.map((s,i)=>`
    <div class="set-card">
      <div class="set-header">
        <span class="set-num">セット ${i+1}</span>
        ${sets.length>1?`<button class="btn-del" onclick="removeSet(${i})">✕ 削除</button>`:''}
      </div>
      <div class="grid3">
        <div>
          <div class="field-label">時間(分)</div>
          <input type="number" value="${s.duration}" min="1" max="30" style="text-align:center" onchange="updateSet(${i},'duration',this.value)">
        </div>
        <div>
          <div class="field-label">温度(℃)</div>
          <input type="number" value="${s.temp}" min="50" max="120" style="text-align:center" onchange="updateSet(${i},'temp',this.value)">
        </div>
        <div>
          <div class="field-label">水風呂</div>
          <select onchange="updateSet(${i},'water',this.value)" style="text-align:center">
            <option value="yes" ${s.water==='yes'?'selected':''}>あり</option>
            <option value="no" ${s.water==='no'?'selected':''}>なし</option>
          </select>
        </div>
      </div>
    </div>
  `).join('');
}

function addSet() { sets.push({duration:'10',temp:'90',water:'yes'}); renderSets(); }
function removeSet(i) { sets.splice(i,1); renderSets(); }
function updateSet(i,k,v) { sets[i][k]=v; }

function renderMoods() {
  document.getElementById('moodRow').innerHTML = [1,2,3,4,5].map(n=>`
    <button class="mood-btn ${selectedMood===String(n)?'selected':''}" onclick="selectMood('${n}')">${MOODS[n]}</button>
  `).join('');
}
function selectMood(n) { selectedMood=n; renderMoods(); }

function calcLoss() {
  const a=document.getElementById('fWBefore').value;
  const b=document.getElementById('fWAfter').value;
  const loss=weightLoss(a,b);
  document.getElementById('lossPreview').textContent = loss?`発汗量 -${loss}kg`:'';
}

// ═══════════════════════════════════════════════
// AUTOCOMPLETE
// ═══════════════════════════════════════════════
function getFacilityHistory() {
  // Collect unique facility names from all logs, sorted by most recent
  const seen = new Set();
  const result = [];
  logs.forEach(l => {
    if(l.facility && !seen.has(l.facility)) {
      seen.add(l.facility);
      result.push(l.facility);
    }
  });
  return result;
}

function highlightMatch(text, query) {
  if(!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) +
    `<span class="autocomplete-match">${text.slice(idx, idx+query.length)}</span>` +
    text.slice(idx+query.length);
}

function onFacilityInput() {
  validateForm();
  const val = document.getElementById('fFacility').value;
  const list = document.getElementById('acList');
  const history = getFacilityHistory();

  const matches = val.trim() === ''
    ? history.slice(0, 6)
    : history.filter(f => f.toLowerCase().includes(val.toLowerCase()) && f !== val).slice(0, 6);

  if(matches.length === 0) { list.style.display='none'; return; }

  list.innerHTML = matches.map(f => `
    <div class="autocomplete-item" onclick="selectFacility('${f.replace(/'/g,"\\'")}')">
      <span class="autocomplete-icon">♨️</span>
      <span>${highlightMatch(f, val.trim())}</span>
    </div>
  `).join('');
  list.style.display = 'block';
}

function selectFacility(name) {
  document.getElementById('fFacility').value = name;
  document.getElementById('acList').style.display = 'none';
  validateForm();
}

// Close autocomplete when tapping outside
document.addEventListener('click', e => {
  if(!e.target.closest('.autocomplete-wrap')) {
    const list = document.getElementById('acList');
    if(list) list.style.display='none';
  }
});

function validateForm() {
  const ok = !!document.getElementById('fFacility').value.trim();
  document.getElementById('saveBtn').disabled = !ok;
}

function saveLog() {
  const facility = document.getElementById('fFacility').value.trim();
  if(!facility) return;
  const log = {
    id: Date.now().toString(),
    date: document.getElementById('fDate').value,
    facility,
    weight_before: document.getElementById('fWBefore').value,
    weight_after: document.getElementById('fWAfter').value,
    mood: selectedMood,
    sets: sets.map(s=>({...s})),
    notes: document.getElementById('fNotes').value,
  };
  logs = [log,...logs].sort((a,b)=>b.date.localeCompare(a.date));
  saveLogs(currentUser.id, logs);
  goHome();
}

function updateLog() {
  const facility = document.getElementById('fFacility').value.trim();
  if(!facility || !editingLogId) return;
  const updated = {
    id: editingLogId,
    date: document.getElementById('fDate').value,
    facility,
    weight_before: document.getElementById('fWBefore').value,
    weight_after: document.getElementById('fWAfter').value,
    mood: selectedMood,
    sets: sets.map(s=>({...s})),
    notes: document.getElementById('fNotes').value,
  };
  logs = logs.map(l=>l.id===editingLogId?updated:l).sort((a,b)=>b.date.localeCompare(a.date));
  saveLogs(currentUser.id, logs);
  showOnly('detailRoot');
  renderDetail(updated);
}

// ═══════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════
function exportJSON() {
  const data = { user: currentUser.name, exportedAt: new Date().toISOString(), logs };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sauna-log-${currentUser.name}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportCSV() {
  const header = ['日付','施設名','入浴前(kg)','入浴後(kg)','発汗量(kg)','セット数','合計時間(分)','整い度','メモ'];
  const rows = logs.map(l => {
    const loss = (l.weight_before && l.weight_after)
      ? (parseFloat(l.weight_before)-parseFloat(l.weight_after)).toFixed(1) : '';
    return [
      l.date, l.facility,
      l.weight_before||'', l.weight_after||'', loss,
      l.sets.length, totalMin(l.sets),
      MOODS[parseInt(l.mood)]||'', l.notes||''
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = '\uFEFF' + [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sauna-log-${currentUser.name}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function importJSON(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.logs || !Array.isArray(data.logs)) throw new Error('invalid');
      const incoming = data.logs;
      // 既存ログとIDで重複チェックしてマージ
      const existingIds = new Set(logs.map(l=>l.id));
      const newLogs = incoming.filter(l=>!existingIds.has(l.id));
      const merged = [...logs, ...newLogs].sort((a,b)=>b.date.localeCompare(a.date));
      logs = merged;
      saveLogs(currentUser.id, logs);
      // リセットして統計再描画
      event.target.value = '';
      alert(`✅ 復元完了！\n${newLogs.length}件を追加しました（重複は除外）`);
      renderStats();
      renderHome();
    } catch {
      alert('❌ ファイルの形式が正しくありません。\nサウナ記録帳からエクスポートしたJSONファイルを選択してください。');
    }
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════
function renderDetail(log) {
  document.getElementById('detailTitle').textContent = log.facility;
  const loss = weightLoss(log.weight_before, log.weight_after);
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-date">${fmtDate(log.date)}</div>
    <div class="detail-facility">${log.facility}</div>
    <div class="detail-mood">${MOODS[parseInt(log.mood)]||'🙂'}</div>

    ${(log.weight_before||log.weight_after)?`
    <div class="detail-card teal-bg">
      <div class="section-label teal" style="margin-bottom:8px">💧 体重</div>
      <div class="weight-grid">
        <div><div class="weight-label">入浴前</div><div class="weight-val">${log.weight_before||'—'}<span class="weight-unit">kg</span></div></div>
        <div class="weight-arrow">→</div>
        <div><div class="weight-label">入浴後</div><div class="weight-val">${log.weight_after||'—'}<span class="weight-unit">kg</span></div></div>
      </div>
      ${loss?`<div class="weight-loss">発汗量 -${loss}kg</div>`:''}
    </div>`:''}

    <div class="detail-card orange-bg">
      <div class="section-label orange" style="margin-bottom:10px">♨️ セット詳細</div>
      ${log.sets.map((s,i)=>`
        <div class="set-row">
          <span class="set-row-num">セット${i+1}</span>
          <div class="set-row-data">
            <span>⏱${s.duration}分</span>
            <span>🌡${s.temp}℃</span>
            <span>${s.water==='yes'?'🏊あり':'🚫なし'}</span>
          </div>
        </div>
      `).join('')}
      <div class="total-min">合計 ${totalMin(log.sets)}分</div>
    </div>

    ${log.notes?`
    <div class="detail-card plain">
      <div class="note-label">📝 メモ</div>
      <div class="note-text">${log.notes}</div>
    </div>`:''}

    <button class="btn-delete" onclick="deleteLog('${log.id}')">🗑 この記録を削除</button>
  `;
}

function deleteLog(id) {
  if(!confirm('この記録を削除しますか？')) return;
  logs = logs.filter(l=>l.id!==id);
  saveLogs(currentUser.id, logs);
  goHome();
}
</script>
